name: a8-sync

# Manual run of the same A8 step the daily live-pipeline does first (docs/20): finds each
# configured brand's program in the A8 console, applies when the account has not joined, reads
# the ad link for the site and stores it in the database. The links, program names and
# conditions are member-only and this log is public, so the output is counts by outcome.
on:
  workflow_dispatch:

permissions:
  contents: read

# Shares the group with the other A8 workflows: never two logins at once.
concurrency:
  group: a8-login
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: a8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Keep the A8 programs in step
        run: pnpm tsx apps/worker/src/index.ts a8-sync --a8-programs config/a8-programs.json
        env:
          A8_BROWSER_CHANNEL: chrome
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          A8_LOGIN_ID: ${{ secrets.A8_LOGIN_ID }}
          A8_LOGIN_PASSWORD: ${{ secrets.A8_LOGIN_PASSWORD }}

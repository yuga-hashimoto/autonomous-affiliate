name: a8-sync

# Manual run of the same A8 step the daily live-pipeline does first (docs/20): finds each
# configured brand's program in the A8 console, applies when the account has not joined, reads
# the ad link for the site and stores it in the database. The links, program names and
# conditions are member-only and this log is public, so the output is counts by outcome.
on:
  workflow_dispatch:
    inputs:
      scout:
        description: Also pick new advertisers from the console (docs/21); needs the live policy and the model
        type: boolean
        required: false
        default: false
      vets:
        description: Advertiser sites to check in one run when picking (1 to 6; the daily run checks 2)
        type: string
        required: false
        default: "2"

permissions:
  contents: read

# Shares the group with the other A8 workflows: never two logins at once.
concurrency:
  group: a8-login
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: a8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Keep the A8 programs in step
        run: |
          ARGS=()
          if [ "$SCOUT" = "true" ]; then
            printf '%s' "$LIVE_POLICY_YAML" > config/policy.live.yaml
            ARGS+=(--scout --policy config/policy.live.yaml)
          fi
          pnpm tsx apps/worker/src/index.ts a8-sync --a8-programs config/a8-programs.json "${ARGS[@]}"
        env:
          SCOUT: ${{ inputs.scout }}
          A8_SCOUT_MAX_VETS: ${{ inputs.vets }}
          LIVE_POLICY_YAML: ${{ secrets.LIVE_POLICY_YAML }}
          LLM_PROVIDER: openai-compatible
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
          LLM_INPUT_COST_JPY_PER_1M: ${{ vars.LLM_INPUT_COST_JPY_PER_1M }}
          LLM_OUTPUT_COST_JPY_PER_1M: ${{ vars.LLM_OUTPUT_COST_JPY_PER_1M }}
          A8_BROWSER_CHANNEL: chrome
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          A8_LOGIN_ID: ${{ secrets.A8_LOGIN_ID }}
          A8_LOGIN_PASSWORD: ${{ secrets.A8_LOGIN_PASSWORD }}

name: a8-login-smoke

# Manual check: can a GitHub-hosted runner log in to the A8 media console with the
# owner's own credentials, or does A8 stop it with a CAPTCHA or an extra
# verification step? It makes one login attempt and one read of a member page.
# It applies to nothing, changes nothing and does not read program details.
#
# The repository and this log are public, so the only output is an outcome code,
# a page path and a short hint. The credentials are secrets of the "a8"
# environment, which only the main branch may use (docs/16-live-rollout.md).
on:
  workflow_dispatch:

permissions:
  contents: read

# Never two logins at once: parallel attempts look like abuse and can lock the account.
concurrency:
  group: a8-login
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: a8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Try one login
        # Uses the runner's own Google Chrome: no browser download, no apt packages.
        run: pnpm tsx apps/worker/src/index.ts a8-login-smoke
        env:
          A8_BROWSER_CHANNEL: chrome
          A8_LOGIN_ID: ${{ secrets.A8_LOGIN_ID }}
          A8_LOGIN_PASSWORD: ${{ secrets.A8_LOGIN_PASSWORD }}

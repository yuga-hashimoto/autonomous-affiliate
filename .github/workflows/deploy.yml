name: deploy

# Manual static-site deploy to Cloudflare Pages from the committed article
# store. Publishing itself is gated by the worker (QA PASS + policy); this
# workflow only ships the already-committed site build.
# Required secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository_owner != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build site (fails the deploy if the build breaks)
        run: pnpm --filter site build
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/site/dist --project-name=${{ vars.CF_PAGES_PROJECT || 'autonomous-affiliate' }}

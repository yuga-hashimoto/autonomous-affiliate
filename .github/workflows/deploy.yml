name: deploy

# Static-site deploy to Cloudflare Pages from the committed article store.
# Runs automatically after CI passes on main (a red lint/type/test/build never
# ships) and can still be started by hand. Publishing itself is gated by the
# worker (QA PASS + policy); this workflow only ships the already-committed
# site build. Pushes made by live-pipeline use GITHUB_TOKEN, which does not
# start CI, so that job keeps deploying for itself and nothing deploys twice.
# Required secret: CLOUDFLARE_API_TOKEN.
# Required variables: CLOUDFLARE_ACCOUNT_ID, SITE_BASE_URL, CF_PAGES_PROJECT.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository_owner != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Ship exactly the commit CI validated, not whatever main moved to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build site (fails the deploy if the build breaks)
        run: pnpm --filter site build
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          # Affiliate tracking URLs (JSON: {"offers":{"<offer_id>":"<url>"}}).
          # Kept as a secret — never committed to the repository.
          AFFILIATE_TRACKING_URLS_JSON: ${{ secrets.AFFILIATE_TRACKING_URLS_JSON }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/site/dist --project-name=${{ vars.CF_PAGES_PROJECT || 'autonomous-affiliate' }}

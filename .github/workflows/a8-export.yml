name: a8-export

# Manual, read-only: logs in to the A8 media console and hands the owner the list of approved
# programs (id, name, card text) ENCRYPTED. A8's terms forbid publishing member-only details and
# this repository and its log are public, so the output is one base64 line that only the holder
# of the private key (kept off GitHub) can read. Nothing is submitted or changed.
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: RSA public key (PEM, at least 2048 bits) to encrypt for. Never paste a private key.
        type: string
        required: true

permissions:
  contents: read

# Shares the group with the other A8 workflows: never two logins at once.
concurrency:
  group: a8-login
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: a8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export the approved programs, encrypted
        run: pnpm tsx apps/worker/src/index.ts a8-export-approved
        env:
          A8_BROWSER_CHANNEL: chrome
          A8_EXPORT_PUBLIC_KEY: ${{ inputs.public_key }}
          A8_LOGIN_ID: ${{ secrets.A8_LOGIN_ID }}
          A8_LOGIN_PASSWORD: ${{ secrets.A8_LOGIN_PASSWORD }}

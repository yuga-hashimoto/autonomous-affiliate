name: a8-submit-urls

# Manual run of the same A8 step the daily live-pipeline ends with (docs/20): builds the site from the
# committed articles, finds the article pages that carry a configured brand's ad, and registers their URLs
# in the A8 console (広告掲載URL管理) for that brand's program. Submitting a URL again only renews its date.
# The log is public and the program is member-only, so the output is counts only.
on:
  workflow_dispatch:

permissions:
  contents: read

# Shares the group with the other A8 workflows: never two logins at once.
concurrency:
  group: a8-login
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: a8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the site (pages and their canonical URLs only; nothing is deployed)
        run: pnpm --filter site build
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      - name: Register the article pages with A8
        run: pnpm tsx apps/worker/src/index.ts a8-submit-urls --a8-programs config/a8-programs.json --dist apps/site/dist
        env:
          A8_BROWSER_CHANNEL: chrome
          # The advertisers the run picked itself (docs/21) are in the database.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          A8_LOGIN_ID: ${{ secrets.A8_LOGIN_ID }}
          A8_LOGIN_PASSWORD: ${{ secrets.A8_LOGIN_PASSWORD }}

name: a8-programs

# Manual, read-only: logs in to the A8 media console and reads the partnered-programs
# list. It applies to nothing and changes nothing.
#
# The repository and this log are public and A8's terms forbid publishing member-only
# details, so the output is only counts by status. With "probe" on it also prints the
# page's structure with all content masked (labels, link destinations without ids,
# lengths), to learn what the console looks like.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: Also print the masked page structure
        type: boolean
        default: false

permissions:
  contents: read

# Shares the group with a8-login-smoke: never two logins at once.
concurrency:
  group: a8-login
  cancel-in-progress: false

jobs:
  programs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: a8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the partnered programs
        run: pnpm tsx apps/worker/src/index.ts a8-programs
        env:
          A8_BROWSER_CHANNEL: chrome
          A8_PROBE: ${{ inputs.probe && '1' || '0' }}
          A8_LOGIN_ID: ${{ secrets.A8_LOGIN_ID }}
          A8_LOGIN_PASSWORD: ${{ secrets.A8_LOGIN_PASSWORD }}

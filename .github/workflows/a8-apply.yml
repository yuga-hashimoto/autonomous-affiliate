name: a8-apply

# Manual. Logs in to the A8 media console, finds one advertiser program the account has
# not joined, chooses the target site in its application form and presses the application
# button (提携申請). THAT PRESS IS THE APPLICATION: it goes to the result page, where the
# program may already be joined. The result page is only read, never pressed.
#
# The owner has handed the applications to the AI (AGENTS.md). Consent to terms, CAPTCHAs
# and identity checks are not passed: if one appears the run stops and reports it.
# One run applies to one program: the first search result that mentions the keyword.
#
# The repository and this log are public and A8's terms forbid publishing member-only
# details, so the output is: counts, yes/no flags and the page structure with content masked.
on:
  workflow_dispatch:
    inputs:
      keyword:
        description: Advertiser name to search for (the page structure is printed with it removed)
        type: string
        required: true

permissions:
  contents: read

# Shares the group with the other A8 workflows: never two logins at once.
concurrency:
  group: a8-login
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: a8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply to the program
        run: pnpm tsx apps/worker/src/index.ts a8-apply-start
        env:
          A8_BROWSER_CHANNEL: chrome
          A8_PROGRAM_KEYWORD: ${{ inputs.keyword }}
          A8_SITE_NAME: 総額比較
          A8_LOGIN_ID: ${{ secrets.A8_LOGIN_ID }}
          A8_LOGIN_PASSWORD: ${{ secrets.A8_LOGIN_PASSWORD }}

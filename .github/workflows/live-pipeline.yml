name: live-pipeline

# Dormant until the owner sets LIVE_AUTOMATION_ENABLED=true in repository
# Variables. Keeping this gate false makes deployment impossible by default.
on:
  schedule:
    # 02:17 JST. Off the top of the hour: GitHub delays or drops :00 runs
    # (the last :00 run of this workflow started more than 4 hours late).
    - cron: "17 17 * * *"
  workflow_dispatch:
    inputs:
      template_revision:
        description: >-
          Name of a change to the article generator (for example figures-1). Every live
          article of the plans is regenerated once for this name (docs/04). Leave empty
          for the normal daily run; a repeated name does nothing, a new name runs again.
        required: false
        default: ""

concurrency:
  group: affiliate-live-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live:
    if: ${{ vars.LIVE_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The A8 console login (docs/20) lives in this environment (main branch only). Only the
    # "Keep the A8 programs in step" step names those secrets.
    environment: a8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Hosted runners cannot inherit local opencode credentials. Use the
      # priced API provider for unattended runs; CLI mode remains local/manual.
      LLM_PROVIDER: openai-compatible
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
      LLM_INPUT_COST_JPY_PER_1M: ${{ vars.LLM_INPUT_COST_JPY_PER_1M }}
      LLM_OUTPUT_COST_JPY_PER_1M: ${{ vars.LLM_OUTPUT_COST_JPY_PER_1M }}
      AFFILIATE_TRACKING_URLS_JSON: ${{ secrets.AFFILIATE_TRACKING_URLS_JSON }}
      # Hero images (OpenRouter). Without the key, articles are published text-only.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
      IMAGE_ESTIMATED_COST_USD: ${{ vars.IMAGE_ESTIMATED_COST_USD }}
      IMAGE_USD_JPY: ${{ vars.IMAGE_USD_JPY }}
      IMAGE_MAX_COST_JPY: ${{ vars.IMAGE_MAX_COST_JPY }}
      LIVE_GIT_PUSH: "true"
      LIVE_GIT_REMOTE_REF: main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize private live policy and plans
        env:
          LIVE_POLICY_YAML: ${{ secrets.LIVE_POLICY_YAML }}
          LIVE_PLANS_JSON: ${{ secrets.LIVE_PLANS_JSON }}
        run: |
          test -n "$LIVE_POLICY_YAML" || { echo "LIVE_POLICY_YAML is not configured" >&2; exit 1; }
          test -n "$LIVE_PLANS_JSON" || { echo "LIVE_PLANS_JSON is not configured" >&2; exit 1; }
          printf '%s' "$LIVE_POLICY_YAML" > config/policy.live.yaml
          printf '%s' "$LIVE_PLANS_JSON" > config/plans.live.json
      - name: Keep the A8 programs in step (joins, ad links; counts only in this public log)
        # A failed sync never stops the articles: offers whose program cannot be confirmed
        # are switched off by the pipeline and the articles go out without a link.
        continue-on-error: true
        env:
          A8_BROWSER_CHANNEL: chrome
          A8_LOGIN_ID: ${{ secrets.A8_LOGIN_ID }}
          A8_LOGIN_PASSWORD: ${{ secrets.A8_LOGIN_PASSWORD }}
          # Picking new advertisers from the console (docs/21): off unless the repository variable is "true".
          A8_SCOUT_ENABLED: ${{ vars.A8_SCOUT_ENABLED }}
        run: |
          if [ -f config/a8-programs.json ]; then
            ARGS=()
            if [ "$A8_SCOUT_ENABLED" = "true" ]; then ARGS+=(--scout --policy config/policy.live.yaml); fi
            pnpm tsx apps/worker/src/index.ts a8-sync --a8-programs config/a8-programs.json "${ARGS[@]}"
          fi
      - name: Research and QA; publish new articles and update live ones only when the policy flag is enabled
        env:
          # The input is read from the environment, never interpolated into the script.
          TEMPLATE_REVISION: ${{ inputs.template_revision }}
        run: |
          ARGS=()
          if [ -n "$TEMPLATE_REVISION" ]; then ARGS+=(--template-revision "$TEMPLATE_REVISION"); fi
          # The plans of the pages that list a company's services (docs/19) follow the written plans.
          if [ -f config/discovery.live.json ]; then ARGS+=(--discover config/discovery.live.json); fi
          # Offers follow the A8 programs (docs/20): a link appears only while everything holds.
          if [ -f config/a8-programs.json ]; then ARGS+=(--a8-programs config/a8-programs.json); fi
          pnpm tsx apps/worker/src/index.ts run-pipeline --live --policy config/policy.live.yaml --plans config/plans.live.json "${ARGS[@]}" > raw-output.txt
          cat raw-output.txt
      - name: Summarise new articles and updates
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## live-pipeline"
            if [ -s raw-output.txt ]; then
              sed -n '/^{/,$p' raw-output.txt > result.json
              echo
              echo "Stale articles found by the sweep: $(jq -r '(.refresh.updateCandidates // []) | join(", ") | if . == "" then "none" else . end' result.json)"
              echo
              # Counts only: this log is public and the plans are private. `plans-status` names them locally.
              echo "Plans waiting (by reason): $(jq -r '(.held // {}) | to_entries | map("\(.key) \(.value)") | join(", ") | if . == "" then "none" else . end' result.json)"
              echo
              echo "Plans found on the listed pages: $(jq -r 'if .discovery then "\(.discovery.found) from \(.discovery.sources) source(s); skipped: \((.discovery.skipped | to_entries | map("\(.key) \(.value)") | join(", ")) | if . == "" then "none" else . end)" else "discovery is off" end' result.json)"
              echo
              echo "A8 offers (switched on / known): $(jq -r 'if .a8Offers then "\(.a8Offers.active) / \(.a8Offers.offers)" else "off" end' result.json)"
              echo
              echo "| article | action | update | state | QA | written |"
              echo "| --- | --- | --- | --- | --- | --- |"
              jq -r '.results[] | "| \(.slug) | \(.action) | \(.update.outcome // "-") | \(.finalState) | \(.qaStatus) | \(.published) |"' result.json
              echo
              jq -r '.results[] | select(.update.reasons | length > 0) | "- **\(.slug)**: \(.update.reasons | join(", "))"' result.json
              jq -r '.results[] | select(.qaFailures) | "**\(.slug)**", (.qaFailures[] | "- `\(.id)`: \(.detail)")' result.json
            else
              echo
              echo "The run produced no result (see the job log)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write the affiliate redirects from the database (never committed)
        run: pnpm tsx apps/worker/src/index.ts export-go-offers content/go-offers.generated.json
      - name: Build and deploy the committed site
        run: |
          pnpm --filter site build
          pnpm exec wrangler pages deploy apps/site/dist --project-name="$CF_PAGES_PROJECT"
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          GSC_VERIFICATION_TOKEN: ${{ vars.GSC_VERIFICATION_TOKEN }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Register the article pages with A8 (ad-URL management; counts only in this public log)
        # After the deploy, so the pages exist. Submitting a URL again only renews its date. A failure
        # never fails the run: the next daily run submits them again.
        continue-on-error: true
        env:
          A8_BROWSER_CHANNEL: chrome
          A8_LOGIN_ID: ${{ secrets.A8_LOGIN_ID }}
          A8_LOGIN_PASSWORD: ${{ secrets.A8_LOGIN_PASSWORD }}
        run: |
          if [ -f config/a8-programs.json ]; then
            pnpm tsx apps/worker/src/index.ts a8-submit-urls --a8-programs config/a8-programs.json --dist apps/site/dist
          fi

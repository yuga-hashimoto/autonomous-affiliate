name: live-pipeline

# Dormant until the owner sets LIVE_AUTOMATION_ENABLED=true in repository
# Variables. Keeping this gate false makes deployment impossible by default.
on:
  schedule:
    # 02:17 JST. Off the top of the hour: GitHub delays or drops :00 runs
    # (the last :00 run of this workflow started more than 4 hours late).
    - cron: "17 17 * * *"
  workflow_dispatch:
    inputs:
      template_revision:
        description: >-
          Name of a change to the article generator (for example figures-1). Every live
          article of the plans is regenerated once for this name (docs/04). Leave empty
          for the normal daily run; a repeated name does nothing, a new name runs again.
        required: false
        default: ""

concurrency:
  group: affiliate-live-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live:
    if: ${{ vars.LIVE_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Hosted runners cannot inherit local opencode credentials. Use the
      # priced API provider for unattended runs; CLI mode remains local/manual.
      LLM_PROVIDER: openai-compatible
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
      LLM_INPUT_COST_JPY_PER_1M: ${{ vars.LLM_INPUT_COST_JPY_PER_1M }}
      LLM_OUTPUT_COST_JPY_PER_1M: ${{ vars.LLM_OUTPUT_COST_JPY_PER_1M }}
      AFFILIATE_TRACKING_URLS_JSON: ${{ secrets.AFFILIATE_TRACKING_URLS_JSON }}
      LIVE_GIT_PUSH: "true"
      LIVE_GIT_REMOTE_REF: main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize private live policy and plans
        env:
          LIVE_POLICY_YAML: ${{ secrets.LIVE_POLICY_YAML }}
          LIVE_PLANS_JSON: ${{ secrets.LIVE_PLANS_JSON }}
        run: |
          test -n "$LIVE_POLICY_YAML" || { echo "LIVE_POLICY_YAML is not configured" >&2; exit 1; }
          test -n "$LIVE_PLANS_JSON" || { echo "LIVE_PLANS_JSON is not configured" >&2; exit 1; }
          printf '%s' "$LIVE_POLICY_YAML" > config/policy.live.yaml
          printf '%s' "$LIVE_PLANS_JSON" > config/plans.live.json
      - name: Research and QA; publish new articles and update live ones only when the policy flag is enabled
        env:
          # The input is read from the environment, never interpolated into the script.
          TEMPLATE_REVISION: ${{ inputs.template_revision }}
        run: |
          ARGS=()
          if [ -n "$TEMPLATE_REVISION" ]; then ARGS+=(--template-revision "$TEMPLATE_REVISION"); fi
          pnpm tsx apps/worker/src/index.ts run-pipeline --live --policy config/policy.live.yaml --plans config/plans.live.json "${ARGS[@]}" > raw-output.txt
          cat raw-output.txt
      - name: Summarise new articles and updates
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## live-pipeline"
            if [ -s raw-output.txt ]; then
              sed -n '/^{/,$p' raw-output.txt > result.json
              echo
              echo "Stale articles found by the sweep: $(jq -r '(.refresh.updateCandidates // []) | join(", ") | if . == "" then "none" else . end' result.json)"
              echo
              echo "| article | action | update | state | QA | written |"
              echo "| --- | --- | --- | --- | --- | --- |"
              jq -r '.results[] | "| \(.slug) | \(.action) | \(.update.outcome // "-") | \(.finalState) | \(.qaStatus) | \(.published) |"' result.json
              echo
              jq -r '.results[] | select(.update.reasons | length > 0) | "- **\(.slug)**: \(.update.reasons | join(", "))"' result.json
              jq -r '.results[] | select(.qaFailures) | "**\(.slug)**", (.qaFailures[] | "- `\(.id)`: \(.detail)")' result.json
            else
              echo
              echo "The run produced no result (see the job log)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build and deploy the committed site
        run: |
          pnpm --filter site build
          pnpm exec wrangler pages deploy apps/site/dist --project-name="$CF_PAGES_PROJECT"
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

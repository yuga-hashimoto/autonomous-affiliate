name: a8-link-probe

# Manual, read-only: logs in to the A8 media console and opens the ad-link page (広告リンク作成)
# of one joined program. It presses nothing and generates no link.
#
# The repository and this log are public and A8's terms forbid publishing member-only
# details, so the output is: counts, yes/no flags for what the site selector offers, and the
# page structure with all content masked.
on:
  workflow_dispatch:
    inputs:
      keyword:
        description: Advertiser name of a joined program (the page structure is printed with it removed)
        type: string
        required: true

permissions:
  contents: read

# Shares the group with the other A8 workflows: never two logins at once.
concurrency:
  group: a8-login
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: a8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the ad-link page
        run: pnpm tsx apps/worker/src/index.ts a8-link-probe
        env:
          A8_BROWSER_CHANNEL: chrome
          A8_PROGRAM_KEYWORD: ${{ inputs.keyword }}
          A8_SITE_NAME: 総額比較
          A8_LOGIN_ID: ${{ secrets.A8_LOGIN_ID }}
          A8_LOGIN_PASSWORD: ${{ secrets.A8_LOGIN_PASSWORD }}

name: a8-inspect-program

# Manual, read-only: logs in to the A8 media console, searches for one advertiser
# program and reads its detail page and the page with the application form.
# It submits nothing and applies to nothing.
#
# The repository and this log are public and A8's terms forbid publishing member-only
# details (program names, conditions, rewards). So the output is: counts, yes/no flags
# for a fixed list of wordings, whether the target site can be chosen in the form, and
# the page structure with all content masked.
on:
  workflow_dispatch:
    inputs:
      keyword:
        description: Advertiser name to search for (the page structure is printed with it removed)
        type: string
        required: true
        default: プレミアムウォーター

permissions:
  contents: read

# Shares the group with the other A8 workflows: never two logins at once.
concurrency:
  group: a8-login
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: a8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the program pages
        run: pnpm tsx apps/worker/src/index.ts a8-inspect-program
        env:
          A8_BROWSER_CHANNEL: chrome
          A8_PROGRAM_KEYWORD: ${{ inputs.keyword }}
          A8_SITE_NAME: 総額比較
          A8_LOGIN_ID: ${{ secrets.A8_LOGIN_ID }}
          A8_LOGIN_PASSWORD: ${{ secrets.A8_LOGIN_PASSWORD }}
